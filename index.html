<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enkai Art Agency — Trần Quang Trung</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="site-header">
        <div class="logo">Enkai</div>
        <nav class="main-nav">
            <a href="#gallery" class="active">Tác phẩm</a>
        </nav>
    </header>

    <!-- Bộ Sưu Tập - Trang Chủ NHƯ CŨ -->
    <section class="gallery" id="gallery">
        <div class="section-head">
            <h2>Bộ Sưu Tập</h2>
            <p>Mỗi tác phẩm đều là một phần của câu chuyện riêng</p>
            <div class="search-wrap">
                <input type="text" class="search-box" placeholder="Tìm kiếm tác phẩm...">
            </div>
        </div>

        <div class="art-grid">
            <!-- ⚠️ Các tác phẩm bạn thêm ở Admin sẽ tự động hiện ở đây, giữ cấu trúc như cũ -->
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
